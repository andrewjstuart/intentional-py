<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Intentional — Web prototype</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon.png" type="image/png" />
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1f23;
    --muted: #57606a;
    --border: #d0d7de;
    --ok: #1a7f37;
    --fail: #cf222e;
    --accent: #1f6aa5;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --ok: #3fb950;
      --fail: #f85149;
      --accent: #4098d7;
      --accent-fg: #0d1117;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --fg: #1b1f23; --muted: #57606a; --border: #d0d7de;
    --ok: #1a7f37; --fail: #cf222e; --accent: #1f6aa5; --accent-fg: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
    --ok: #3fb950; --fail: #f85149; --accent: #4098d7; --accent-fg: #0d1117;
  }
  body {
    font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto;
    padding: 0 1rem; background: var(--bg); color: var(--fg);
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  h1 { font-size: 1.4rem; margin: 0; }
  #status { color: var(--muted); }
  fieldset { border: 1px solid var(--border); border-radius: 6px; margin: 1rem 0; }
  label { display: block; margin: 0.5rem 0; }
  input[type="text"] { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
  button {
    margin-top: 0.5rem; padding: 0.4rem 1rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--accent); color: var(--accent-fg); cursor: pointer;
  }
  #themeToggle { background: transparent; color: var(--fg); padding: 0.3rem 0.7rem; }
  #result {
    white-space: pre-wrap; border: 1px solid var(--border); border-radius: 6px;
    padding: 1rem; margin-top: 1rem; min-height: 2rem;
  }
  .ok { color: var(--ok); }
  .fail { color: var(--fail); }
  a { color: var(--accent); }
  #downloadLink { display: none; margin-left: 0.5rem; }
  select { background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 0.3rem; }
  input[type="checkbox"] { width: auto; margin-right: 0.4rem; }
</style>
</head>
<body>
  <header>
    <h1>Intentional — Web prototype</h1>
    <button id="themeToggle" type="button" aria-label="Toggle light/dark mode"></button>
  </header>
  <p>
    Upload the same project folder (zipped) or Excel file you'd use with the CLI/GUI.
    This runs the real core, compiled to WebAssembly via
    <a href="https://pyodide.org/" target="_blank" rel="noopener">Pyodide</a> — nothing is
    uploaded anywhere; it all runs in this tab.
  </p>
  <p id="status">Loading Python runtime…</p>
  <fieldset>
    <label>
      Task
      <select id="task">
        <option value="validate">Validate</option>
        <option value="buildDd">Build DD intents</option>
        <option value="buildNl">Build NL intents</option>
        <option value="extract">Extract phrases from Excel</option>
        <option value="design">Create config from design document</option>
        <option value="compare">Compare with an agent export</option>
      </select>
    </label>
    <div id="field-projectZip">
      <label>
        Project zip
        <input type="file" id="zipInput" accept=".zip" disabled />
      </label>
    </div>
    <div id="field-excelFile">
      <label>
        Excel file
        <input type="file" id="excelInput" accept=".xlsb,.xlsm,.xlsx" disabled />
      </label>
    </div>
    <div id="field-exportZip">
      <label>
        Agent export (zip)
        <input type="file" id="exportInput" accept=".zip" disabled />
      </label>
    </div>
    <div id="field-configName">
      <label>
        Config file name (optional; blank uses the standard name)
        <input type="text" id="configName" placeholder="intents.cfg" />
      </label>
    </div>
    <div id="field-mode">
      <label>
        Mode
        <select id="mode">
          <option value="DD">DD</option>
          <option value="NL">NL</option>
        </select>
      </label>
    </div>
    <div id="field-language">
      <label>
        Language
        <select id="language">
          <option value="en">en</option>
          <option value="es">es</option>
          <option value="fr">fr</option>
        </select>
      </label>
    </div>
    <div id="field-sheet">
      <label>
        Sheet name (optional; blank finds the first sheet with a header row)
        <input type="text" id="sheet" />
      </label>
    </div>
    <div id="field-vertical">
      <label>
        Vertical prefix
        <input type="text" id="vertical" placeholder="FIN" />
      </label>
    </div>
    <div id="field-context">
      <label>
        Context (optional; blank uses GetIntent)
        <input type="text" id="context" />
      </label>
    </div>
    <div id="field-lowercase">
      <label><input type="checkbox" id="lowercase" />Lowercase actions</label>
    </div>
    <div id="field-reuse">
      <label><input type="checkbox" id="reuse" />Reuse the existing NL config</label>
    </div>
    <div id="field-clean">
      <label><input type="checkbox" id="clean" />Clear the intents folder first (old files are zipped)</label>
    </div>
    <button id="runButton" disabled>Run</button>
    <a id="downloadLink" download="result.zip">Download result.zip</a>
  </fieldset>
  <div id="result"></div>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="app.js"></script>
</body>
</html>
