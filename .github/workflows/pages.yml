# Builds the wheel and deploys the web version (web/) to GitHub Pages, so trying
# it needs nothing but a browser - no local Python, shell, or terminal access,
# unlike web/serve.py which this mirrors for local development.
#
# One-time setup on GitHub: Settings > Pages > Source: GitHub Actions.
name: Deploy web version to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; let an in-progress run finish rather than cancel it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build the wheel
        run: uv build --wheel

      - name: Copy the wheel into web/, same as serve.py does locally
        run: |
          rm -f web/intentional_py-*.whl
          cp dist/intentional_py-*.whl web/
          basename dist/intentional_py-*.whl > web/wheel-filename.txt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
