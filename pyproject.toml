[project]
name = "intentional-py"
version = "1.0.3"
description = "This is a script to create Dialogflow ES Intents"
readme = "README.md"
authors = [
    { name = "Andrew Stuart", email = "andrewjstuart4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pyinstaller>=6.22.3",
    "pyxlsb>=1.0.10",
    "rich>=14.2.0",
    "ruff>=0.16.9",
    "typer>=0.27.2",
]

[project.scripts]
intentional-py = "intentional_py:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
