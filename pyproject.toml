[project]
name = "intentional-py"
version = "1.1.0"
description = "This is a script to create Dialogflow ES Intents"
readme = "README.md"
authors = [
    { name = "Andrew Stuart", email = "andrewjstuart4@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5,<4.0.0",
    "pyxlsb>=1.0.10,<2.0.0",
    "rich>=15.0.0,<16.0.0",
    "typer>=0.27.2,<0.30.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2.2,<7.0.0"]
dev = ["pyinstaller>=6.22.3,<7.0.0", "ruff>=0.16.9,<0.20.0", "pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
intentional-cli = "intentional_py.__main__:main"

[project.gui-scripts]
intentional = "intentional_py.gui.app:launch"

[tool.ruff.lint.flake8-bugbear]
# typer.Option()/typer.Argument() build immutable parameter specs; safe as defaults
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
